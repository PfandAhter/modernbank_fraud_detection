apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-service
  labels:
    app: fraud-detection-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-detection-service
  template:
    metadata:
      labels:
        app: fraud-detection-service
    spec:
      containers:
      - name: fraud-detection-service
        image: ataberkbulutacr.azurecr.io/fraud-detection-service:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        env:
          # --- Application Port ---
          - name: PORT
            value: "8001"

          # --- Kafka Configuration ---
          - name: KAFKA_BOOTSTRAP_SERVERS
            value: "kafka-service:9092"
          - name: KAFKA_GROUP_ID
            value: "fraud-detection-group"
          - name: KAFKA_FRAUD_TOPIC
            value: "fraud-evaluation-requests"

          # --- Model Configuration ---
          - name: MODEL_PATH
            value: "/app/models/xgb_model.pkl"
          - name: FLAG_THRESHOLD
            value: "0.5"

          # --- Logging ---
          - name: LOG_LEVEL
            value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /docs
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /docs
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-service
  labels:
    app: fraud-detection-service
spec:
  selector:
    app: fraud-detection-service
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8001
